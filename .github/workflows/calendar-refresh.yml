name: Actualizar calendario económico
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: write
concurrency:
  group: calendar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Descargar y validar semanas
        run: node scripts/updateCalendarSnapshot.mjs
      - name: Publicar solo datos públicos del calendario
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calendar-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualiza calendario económico validado'
          git push
